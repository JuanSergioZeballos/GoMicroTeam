services:
  # ----------------------------------------------------------
  # Service Registry — etcd
  # ----------------------------------------------------------
  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.13
    container_name: etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Order Service
  # ----------------------------------------------------------
  order-service:
    build:
      context: ..
      dockerfile: MicroServicios/order-service/Dockerfile
    container_name: order-service
    environment:
      - MICRO_REGISTRY=etcd
      - MICRO_REGISTRY_ADDRESS=etcd:2379
      - MICRO_TRANSPORT=grpc
      - MICRO_SERVER=grpc
      - MICRO_CLIENT=grpc
      - MICRO_SERVER_NAME=order-service
    depends_on:
      etcd:
        condition: service_healthy
    networks:
      - ecommerce-net
    restart: unless-stopped

  # ----------------------------------------------------------
  # Product Service
  # ----------------------------------------------------------
  product-service:
    build:
      context: ..
      dockerfile: MicroServicios/product-service/Dockerfile
    container_name: product-service
    environment:
      - MICRO_REGISTRY=etcd
      - MICRO_REGISTRY_ADDRESS=etcd:2379
      - MICRO_TRANSPORT=grpc
      - MICRO_SERVER=grpc
      - MICRO_CLIENT=grpc
      - MICRO_SERVER_NAME=product-service
    depends_on:
      etcd:
        condition: service_healthy
    networks:
      - ecommerce-net
    restart: unless-stopped

  # ----------------------------------------------------------
  # User Service
  # ----------------------------------------------------------
  user-service:
    build:
      context: ..
      dockerfile: MicroServicios/user-service/Dockerfile
    container_name: user-service
    environment:
      - MICRO_REGISTRY=etcd
      - MICRO_REGISTRY_ADDRESS=etcd:2379
      - MICRO_TRANSPORT=grpc
      - MICRO_SERVER=grpc
      - MICRO_CLIENT=grpc
      - MICRO_SERVER_NAME=user-service
    depends_on:
      etcd:
        condition: service_healthy
    networks:
      - ecommerce-net
    restart: unless-stopped

  # ----------------------------------------------------------
  # API Gateway
  # ----------------------------------------------------------
  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - MICRO_REGISTRY=etcd
      - MICRO_REGISTRY_ADDRESS=etcd:2379
      - MICRO_TRANSPORT=grpc
      - MICRO_SERVER=grpc
      - MICRO_CLIENT=grpc
      - MICRO_SERVER_NAME=api-gateway
    depends_on:
      - order-service
      - product-service
      - user-service
    networks:
      - ecommerce-net
    restart: unless-stopped

  # ----------------------------------------------------------
  # Web Frontend
  # ----------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: web-frontend
    ports:
      - "3000:80"
    volumes:
      - ../index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - ecommerce-net
    restart: unless-stopped

networks:
  ecommerce-net:
    driver: bridge
