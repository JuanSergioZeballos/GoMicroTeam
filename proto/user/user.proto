syntax = "proto3";

package user;

option go_package = "./proto/user";

// UserService - Servicio de gestión de usuarios / autenticación básica
// Proporciona registro, autenticación y consulta de clientes.
service UserService {
    // Registrar un nuevo usuario
    rpc Register(RegisterRequest) returns (RegisterResponse);
    // Autenticar un usuario (login)
    rpc Login(LoginRequest) returns (LoginResponse);
    // Obtener perfil de un usuario por ID
    rpc GetUser(GetUserRequest) returns (GetUserResponse);
    // Listar usuarios registrados
    rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}

// ---------- Mensajes ----------

message User {
    string id = 1;
    string name = 2;
    string email = 3;
    string role = 4;        // CUSTOMER, ADMIN
    string created_at = 5;
}

// --- Register ---
message RegisterRequest {
    string name = 1;
    string email = 2;
    string password = 3;
}

message RegisterResponse {
    User   user = 1;
    string message = 2;
    bool   success = 3;
}

// --- Login ---
message LoginRequest {
    string email = 1;
    string password = 2;
}

message LoginResponse {
    User   user = 1;
    string token = 2;
    bool   success = 3;
    string message = 4;
}

// --- GetUser ---
message GetUserRequest {
    string user_id = 1;
}

message GetUserResponse {
    User user = 1;
    bool found = 2;
}

// --- ListUsers ---
message ListUsersRequest {}

message ListUsersResponse {
    repeated User users = 1;
}
